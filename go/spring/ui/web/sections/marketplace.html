<div class="section-container l8-section">
    <div class="page-header"><h1>Marketplace</h1></div>
    <div class="l8-module-tabs">
        <button class="l8-module-tab active" data-module="browse">

        <button class="l8-module-tab" data-module="mylistings">

        <button class="l8-module-tab" data-module="mybids">
            <span class="tab-label">My Bids</span>

    <div class="l8-module-content" data-module="mylistings">

        </div>

    <!-- Reviews -->
    <div class="l8-module-content" data-module="reviews">
        <div class="l8-subnav">
            <a class="l8-subnav-item active" data-service="reviews">Reviews</a>
        </div>
