<div class="section-container" id="dashboard-section">
    <div id="nav-stats" class="nav-stats-grid">
        <div class="nav-stat-card">
            <div class="nav-stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
            </div>
            <div class="nav-stat-content">
                <div class="nav-stat-value" id="stat-listings">-</div>
                <div class="nav-stat-label">Active Listings</div>
            </div>
        </div>

        <div class="nav-stat-card">
            <div class="nav-stat-icon warning">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <div class="nav-stat-content">
                <div class="nav-stat-value" id="stat-bids">-</div>
                <div class="nav-stat-label">Pending Bids</div>
            </div>
        </div>

        <div class="nav-stat-card">
            <div class="nav-stat-icon success">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <div class="nav-stat-content">
                <div class="nav-stat-value" id="stat-deals">-</div>
                <div class="nav-stat-label">Active Deals</div>
            </div>
        </div>

        <div class="nav-stat-card">
            <div class="nav-stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
            </div>
            <div class="nav-stat-content">
                <div class="nav-stat-value" id="stat-reviews">-</div>
                <div class="nav-stat-label">Reviews</div>
            </div>
        </div>
    </div>

    <div id="nav-content"></div>
</div>

<style>
    #dashboard-section { }
    #nav-stats { margin-bottom: var(--spacing-lg); }
</style>

<script>
function initMobileDashboard() {
    loadDashboardStats();
    Layer8MNav.showHome();
}

async function loadDashboardStats() {
    var kpis = [
        { id: 'stat-listings', endpoint: '/10/Listing', query: 'select * from SpringListing where status=2 limit 1 page 0' },
        { id: 'stat-bids', endpoint: '/10/Bid', query: 'select * from SpringBid where status=1 limit 1 page 0' },
        { id: 'stat-deals', endpoint: '/10/Deal', query: 'select * from SpringDeal where status=2 limit 1 page 0' },
        { id: 'stat-reviews', endpoint: '/10/Review', query: 'select * from SpringReview where status=2 limit 1 page 0' }
    ];

    await Promise.all(kpis.map(function(kpi) { return loadKPI(kpi); }));
}

async function loadKPI(kpi) {
    try {
        var body = encodeURIComponent(JSON.stringify({ text: kpi.query }));
        var response = await Layer8MAuth.get(Layer8MConfig.resolveEndpoint(kpi.endpoint) + '?body=' + body);
        var element = document.getElementById(kpi.id);
        if (element) {
            if (response && response.metadata && response.metadata.keyCount && response.metadata.keyCount.counts) {
                element.textContent = response.metadata.keyCount.counts.Total || 0;
            } else {
                element.textContent = '0';
            }
        }
    } catch (error) {
        var el = document.getElementById(kpi.id);
        if (el) el.textContent = '0';
    }
}
</script>
