syntax = "proto3";
package spring;
option go_package = "./types/spring";

import "l8common.proto";
import "api.proto";

enum SpringDealStatus {
    SPRING_DEAL_STATUS_UNSPECIFIED = 0;
    SPRING_DEAL_STATUS_PENDING_PAYMENT = 1;
    SPRING_DEAL_STATUS_PAID = 2;
    SPRING_DEAL_STATUS_SHIPPED = 3;
    SPRING_DEAL_STATUS_DELIVERED = 4;
    SPRING_DEAL_STATUS_COMPLETED = 5;
    SPRING_DEAL_STATUS_DISPUTED = 6;
    SPRING_DEAL_STATUS_CANCELLED = 7;
    SPRING_DEAL_STATUS_REFUNDED = 8;
}

enum SpringDisputeStatus {
    SPRING_DISPUTE_STATUS_UNSPECIFIED = 0;
    SPRING_DISPUTE_STATUS_OPEN = 1;
    SPRING_DISPUTE_STATUS_UNDER_REVIEW = 2;
    SPRING_DISPUTE_STATUS_RESOLVED_BUYER = 3;
    SPRING_DISPUTE_STATUS_RESOLVED_SELLER = 4;
    SPRING_DISPUTE_STATUS_ESCALATED = 5;
}

message SpringDeal {
    string deal_id = 1;
    string listing_id = 2;
    string bid_id = 3;
    string buyer_id = 4;
    string seller_id = 5;
    string buyer_display_name = 6;
    string seller_display_name = 7;
    string item_title = 8;
    l8common.Money agreed_price = 9;
    l8common.Money shipping_cost = 10;
    l8common.Money total_amount = 11;
    SpringDealStatus status = 12;
    string payment_reference = 13;
    string tracking_number = 14;
    string shipping_carrier = 15;
    int64 shipped_at = 16;
    int64 delivered_at = 17;
    int64 completed_at = 18;
    repeated SpringDealMessage messages = 19;
    SpringDealDispute dispute = 22;
    l8common.AuditInfo audit_info = 20;
    map<string, string> custom_fields = 21;
}

message SpringDealMessage {
    string message_id = 1;
    string sender_id = 2;
    string sender_display_name = 3;
    string content = 4;
    int64 sent_at = 5;
}

message SpringDealDispute {
    string reason = 1;
    string description = 2;
    SpringDisputeStatus status = 3;
    string resolution = 4;
    int64 opened_at = 5;
    int64 resolved_at = 6;
    string resolved_by = 7;
}

message SpringDealList {
    repeated SpringDeal list = 1;
    l8api.L8MetaData metadata = 2;
}
