syntax = "proto3";
package spring;
option go_package = "./types/spring";

import "l8common.proto";
import "api.proto";
import "spring-listings.proto";

enum SpringBidStatus {
    SPRING_BID_STATUS_UNSPECIFIED = 0;
    SPRING_BID_STATUS_PENDING = 1;
    SPRING_BID_STATUS_ACCEPTED = 2;
    SPRING_BID_STATUS_REJECTED = 3;
    SPRING_BID_STATUS_WITHDRAWN = 4;
    SPRING_BID_STATUS_EXPIRED = 5;
}

message SpringBid {
    string bid_id = 1;
    string listing_id = 2;
    string seller_id = 3;
    string seller_display_name = 4;
    l8common.Money price = 5;
    SpringItemCondition item_condition = 6;
    string description = 7;
    int32 estimated_ship_days = 8;
    l8common.Money shipping_cost = 9;
    SpringBidStatus status = 10;
    repeated SpringBidImage images = 11;
    float seller_rating = 12;
    l8common.AuditInfo audit_info = 20;
    map<string, string> custom_fields = 21;
}

message SpringBidImage {
    string image_id = 1;
    string storage_path = 2;
    string file_name = 3;
    int64 file_size = 4;
    string caption = 5;
    int32 sort_order = 6;
}

message SpringBidList {
    repeated SpringBid list = 1;
    l8api.L8MetaData metadata = 2;
}
