syntax = "proto3";
package spring;
option go_package = "./types/spring";

import "l8common.proto";
import "api.proto";

enum SpringListingStatus {
    SPRING_LISTING_STATUS_UNSPECIFIED = 0;
    SPRING_LISTING_STATUS_DRAFT = 1;
    SPRING_LISTING_STATUS_ACTIVE = 2;
    SPRING_LISTING_STATUS_FULFILLED = 3;
    SPRING_LISTING_STATUS_EXPIRED = 4;
    SPRING_LISTING_STATUS_CANCELLED = 5;
}

enum SpringItemCondition {
    SPRING_ITEM_CONDITION_UNSPECIFIED = 0;
    SPRING_ITEM_CONDITION_NEW = 1;
    SPRING_ITEM_CONDITION_LIKE_NEW = 2;
    SPRING_ITEM_CONDITION_GOOD = 3;
    SPRING_ITEM_CONDITION_FAIR = 4;
    SPRING_ITEM_CONDITION_ANY = 5;
}

enum SpringShippingPreference {
    SPRING_SHIPPING_PREFERENCE_UNSPECIFIED = 0;
    SPRING_SHIPPING_PREFERENCE_SHIPPING = 1;
    SPRING_SHIPPING_PREFERENCE_LOCAL_PICKUP = 2;
    SPRING_SHIPPING_PREFERENCE_EITHER = 3;
}

message SpringListing {
    string listing_id = 1;
    string buyer_id = 2;
    string buyer_display_name = 3;
    string title = 4;
    string description = 5;
    string category_id = 6;
    SpringItemCondition desired_condition = 7;
    l8common.Money max_price = 8;
    int32 quantity = 9;
    SpringListingStatus status = 10;
    int64 expires_at = 11;
    string location = 12;
    SpringShippingPreference shipping_preference = 13;
    repeated string tags = 14;
    int64 view_count = 15;
    int32 bid_count = 16;
    repeated SpringListingImage images = 17;
    l8common.AuditInfo audit_info = 20;
    map<string, string> custom_fields = 21;
}

message SpringListingImage {
    string image_id = 1;
    string storage_path = 2;
    string file_name = 3;
    int64 file_size = 4;
    string caption = 5;
    int32 sort_order = 6;
}

message SpringListingList {
    repeated SpringListing list = 1;
    l8api.L8MetaData metadata = 2;
}
